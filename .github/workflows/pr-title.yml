name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the PR title is a valid Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit-msg.sh "$PR_TITLE"
