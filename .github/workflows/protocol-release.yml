name: protocol-release

# Tag vX.Y.Z on main: run the checks and tests, then publish a GitHub Release whose
# notes are the CHANGELOG section for that version. The app pins the package by tag.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Release notes exist for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "$TAG" > /dev/null

      - name: Read pinned Dart version
        id: dart-version
        run: echo "version=$(tr -d '[:space:]' < .dart-version)" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ steps.dart-version.outputs.version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install package dependencies
        run: dart pub get
        working-directory: packages/mawaddah_protocol

      - name: Check
        run: scripts/check.sh

      - name: Test
        run: scripts/test.sh

  release:
    name: release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          # Versions below 1.0.0 are pre-releases (same rule as the app repo).
          case "$TAG" in v0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
