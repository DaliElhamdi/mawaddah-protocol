name: deploy-relay

# Staging on every change to the relay merged into main; production on a final
# release tag (vX.Y.Z, no suffix) that is on main. Only push events: a pull
# request, and so a fork, never reaches the Cloudflare secrets.
on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/deploy-relay.yml"
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch: # staging only (a manual re-run from main)

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: deploy
    if: github.repository == 'DaliElhamdi/mawaddah-protocol'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One deploy at a time per environment; a running deploy is never cancelled.
    concurrency:
      group: deploy-relay-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
      cancel-in-progress: false
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: A production tag must be on main
        if: env.TARGET == 'production'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main; production is deployed from main only"
            exit 1
          fi

      - name: A manual run deploys staging from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::run this workflow from main"
          exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install, lint, type-check and test
        working-directory: relay
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Deploy ${{ env.TARGET }}
        id: deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --env "$TARGET" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::wrangler did not print a workers.dev address (is the account's workers.dev subdomain set up?)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -m 10 "$URL/health" | tee /dev/stderr | grep -q '"ok":true'; then
              echo "health OK: $URL"; exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/health did not answer ok"
          exit 1

      - name: Push secret present? (names only)
        continue-on-error: true
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler secret list --env "$TARGET" 2>/dev/null | grep -q '"FCM_SERVICE_ACCOUNT"'; then
            echo "FCM_SERVICE_ACCOUNT is set on $TARGET"
          else
            echo "::warning::FCM_SERVICE_ACCOUNT is not set on $TARGET: the relay works but sends no wake-ups (relay/README.md, Wake-ups)"
          fi
