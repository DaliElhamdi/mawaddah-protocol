# gitleaks configuration (read automatically by `gitleaks detect` in CI).
# Keep every default rule; only skip test-vector files whose "secret" keys are
# public on purpose: PUBLISHED known-answer vectors, printed in the RFCs
# themselves (for example RFC 7748 section 6.1), and GENERATED protocol
# vectors made by tool/gen_vectors.dart from SeededRandom (fixed seeds 1, 2,
# 3, ...; their secrets are test inputs that any implementation must be able
# to reproduce). Never add other paths here: a real secret must never be
# committed to this public repository.

[extend]
useDefault = true

[allowlist]
description = "Published RFC / draft / libsodium test vectors and generated protocol vectors (public values, not secrets)"
paths = [
  '''^packages/mawaddah_protocol/test/vectors/identity\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/safety_number\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/pairing\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/ratchet\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/rfc4231_hmac\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/rfc5869_hkdf\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/rfc7693_blake2b\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/rfc7748_x25519\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/rfc8032_ed25519\.json$''',
  '''^packages/mawaddah_protocol/test/vectors/xchacha20poly1305\.json$''',
]
