name: mawaddah_protocol
description: Pure-Dart protocol package for Mawaddah (crypto, pairing, Double Ratchet, envelopes, events, sync engine and the relay client).
version: 0.0.1
publish_to: none

environment:
  # sodium 4.x needs Dart 3.13 (its build hook compiles libsodium; ADR 0005).
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # libsodium 1.0.22, sumo build, compiled from the source shipped in the
  # package by its build hook (PROTOCOL.md section 2).
  sodium: ^4.1.2+1
  # SHA-256 for the device ID and relay body hashes, which the `sodium` Dart
  # API does not offer (PROTOCOL.md section 2, ADR 0006 point 3). The HKDF
  # tests also use its HMAC-SHA-256 as an independent cross-check.
  crypto: ^3.0.8
  # HTTP client for HttpRelayClient (Dart team package; on Android the app
  # may pass any http.Client, e.g. one with its own TLS settings).
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
