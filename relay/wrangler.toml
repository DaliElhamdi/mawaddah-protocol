# Chosen by the owner (2026-11-11). Production is mawaddah-relay.<account>.workers.dev,
# staging is mawaddah-relay-staging.<account>.workers.dev. The top level is what
# `wrangler dev` and the tests use; `wrangler deploy` always names an environment (see below).
name = "mawaddah-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The relay keeps no request logs (spec 8.5): keep Workers observability off.
[observability]
enabled = false

# One object per device (named by its inbox ID): nonces, inbox, allowed sender, envelopes and blobs.
[[durable_objects.bindings]]
name = "DEVICES"
class_name = "DeviceObject"

# One object per IP bucket (named by a hash): registrations of the last hour.
[[durable_objects.bindings]]
name = "REGISTRATION_LIMITS"
class_name = "RegistrationLimitObject"

# One object per IP bucket (named by a hash): failed pairing-code lookups of the last 10 minutes.
[[durable_objects.bindings]]
name = "LOOKUP_LIMITS"
class_name = "LookupLimitObject"

# One object for all live pairing slots, so codes are unique among them.
[[durable_objects.bindings]]
name = "PAIRING_SLOTS"
class_name = "PairingSlotsObject"

# SQLite-backed Durable Objects (spec 4.5). Migrations are append-only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceObject", "RegistrationLimitObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LookupLimitObject", "PairingSlotsObject"]

# Environments (#25). Wrangler does not inherit bindings or migrations into an
# environment, so each one repeats them. Staging and production are two separate
# Workers with separate Durable Object storage: staging data never reaches production.
# Deploy with `npm run deploy:staging` / `npm run deploy:production` (relay/README.md).
[env.staging]
name = "mawaddah-relay-staging"
workers_dev = true
[env.staging.observability]
enabled = false
[[env.staging.durable_objects.bindings]]
name = "DEVICES"
class_name = "DeviceObject"
[[env.staging.durable_objects.bindings]]
name = "REGISTRATION_LIMITS"
class_name = "RegistrationLimitObject"
[[env.staging.durable_objects.bindings]]
name = "LOOKUP_LIMITS"
class_name = "LookupLimitObject"
[[env.staging.durable_objects.bindings]]
name = "PAIRING_SLOTS"
class_name = "PairingSlotsObject"
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceObject", "RegistrationLimitObject"]
[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["LookupLimitObject", "PairingSlotsObject"]

[env.production]
name = "mawaddah-relay"
workers_dev = true
[env.production.observability]
enabled = false
[[env.production.durable_objects.bindings]]
name = "DEVICES"
class_name = "DeviceObject"
[[env.production.durable_objects.bindings]]
name = "REGISTRATION_LIMITS"
class_name = "RegistrationLimitObject"
[[env.production.durable_objects.bindings]]
name = "LOOKUP_LIMITS"
class_name = "LookupLimitObject"
[[env.production.durable_objects.bindings]]
name = "PAIRING_SLOTS"
class_name = "PairingSlotsObject"
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceObject", "RegistrationLimitObject"]
[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["LookupLimitObject", "PairingSlotsObject"]
